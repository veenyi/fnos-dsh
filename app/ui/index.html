<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepSeek Harness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #0b1023 0%, #0e1223 55%, #131a33 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e2e8f0;
  }
  .card {
    width: 92%;
    max-width: 520px;
    background: rgba(26, 30, 47, 0.85);
    border: 1px solid rgba(51, 65, 85, 0.7);
    border-radius: 20px;
    padding: 44px 40px 40px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, #4d6bfe, #1e2a78);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #f8fafc; }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 30px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 18px 22px;
    margin-bottom: 14px;
    border-radius: 14px;
    border: 1px solid rgba(51, 65, 85, 0.8);
    background: rgba(15, 23, 42, 0.7);
    color: #e2e8f0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
  }
  .btn:hover { transform: translateY(-2px); border-color: #4d6bfe; box-shadow: 0 8px 24px rgba(77, 107, 254, 0.22); }
  .btn:active { transform: translateY(0); }
  .btn .tag {
    font-size: 12px;
    font-weight: 500;
    color: #64748b;
    background: rgba(51, 65, 85, 0.5);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .btn:hover .tag { color: #4d6bfe; }
  .tip {
    margin-top: 18px;
    font-size: 12px;
    color: #64748b;
    line-height: 1.7;
  }
  .tip code {
    color: #94a3b8;
    background: rgba(51, 65, 85, 0.4);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="images/icon.png" alt="DeepSeek Harness" /></div>
    <h1>DeepSeek Harness</h1>
    <div class="sub">DeepSeek AI 开源 Agent Harness · 飞牛版</div>

    <button class="btn" id="btnMain">
      <span>打开 DeepSeek Harness 工作台</span>
      <span class="tag">3080</span>
    </button>

    <div class="tip">
      首次使用：在「设置 → 模型」中填入 DeepSeek 官方 API Key，<br/>
      或直接使用预置的聚合网关（免费模型开箱即用），然后开始对话。
    </div>
  </div>

<script>
  function openPanel(port) {
    var host = window.location.hostname || 'localhost';
    window.open('http://' + host + ':' + port, '_blank');
  }
  document.getElementById('btnMain').addEventListener('click', function () { openPanel(3080); });
</script>
</body>
</html>
